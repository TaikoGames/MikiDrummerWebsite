<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Find a venue email | GRANITE</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/images/icon-180.png">
<style>
  :root{
    --bg:#0b0c0e; --panel:#15171a; --line:#2b2f34; --ink:#eceef0; --muted:#8d949c;
    --accent:#e8672a; --ok:#3fbf6a; --err:#ff6b6b; --warn:#f4b400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue",system-ui,Arial,sans-serif;
       padding:24px max(16px,env(safe-area-inset-left)) 60px;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .back{color:var(--muted);font-size:13px;text-decoration:none}
  h1{font-family:"Arial Black",system-ui,sans-serif;font-size:34px;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.05}
  .lead{color:var(--muted);font-size:15px}
  form{margin-top:22px;display:grid;gap:16px}
  label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
  label span{font-weight:400;color:var(--muted);font-size:13px}
  input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
                 border-radius:12px;padding:14px}
  textarea{min-height:76px;resize:vertical;font-size:16px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .go{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:17px;background:var(--accent);color:#140802;cursor:pointer}
  .go:disabled{opacity:.55;cursor:progress}
  .status{border-radius:12px;padding:13px 14px;font-size:15px;background:var(--panel);border:1px solid var(--line)}
  .status.ok{border-color:var(--ok);color:var(--ok)} .status.err{border-color:var(--err);color:var(--err)}
  .status.work{color:var(--ink)} .status a{color:inherit}
  .status button{font:inherit;font-weight:700;margin-top:10px;border:1px solid currentColor;background:none;color:inherit;
                 border-radius:10px;padding:8px 12px;cursor:pointer}
  h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px}
  ul{list-style:none;display:grid;gap:8px}
  li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  li b{display:block;font-size:15px}
  li span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .setup{margin-top:18px;font-size:14px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px}
  .setup b{color:var(--ink)} .setup ol{margin:8px 0 0 18px} .setup li{background:none;border:0;padding:3px 0}
  .setup code{background:#000;padding:1px 5px;border-radius:5px}
  .setup a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="eyebrow">GRANITE · Booking</span><a class="back" href="/admin.html">← Admin</a></div>
  <h1>Find their email</h1>
  <p class="lead">Paste a venue or promoter's website and it finds their booking email. Then paste that into the <a href="https://claude.ai/artifact/Jc7ebMD6VpDHnXue9Qrqs5" style="color:var(--accent)">GRANITE sender</a>, which sends the pitch from your Gmail.</p>

  <form id="f" novalidate>
    <div>
      <label for="site">Their website</label>
      <input id="site" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="thecobalt.ca">
    </div>
    <button class="go" id="go" type="submit">🔎 Find their email</button>
    <div class="status" id="st" hidden role="status" aria-live="polite"></div>
  </form>

  <div class="setup" id="setup" hidden></div>

  
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const API = 'https://api.github.com/repos/TaikoGames/MikiDrummerWebsite';
  const FLOW = 'granite-pitch.yml';
  const SENDER = 'https://claude.ai/artifact/Jc7ebMD6VpDHnXue9Qrqs5';
  const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
  const token = () => store.get('gh_token');
  const headers = json => Object.assign({ Accept:'application/vnd.github+json', Authorization:'Bearer ' + token() },
                                        json ? { 'Content-Type':'application/json' } : {});
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function status(html, kind){ const s = $('st'); s.hidden = false; s.className = 'status ' + (kind || 'work'); s.innerHTML = html; }


  if (!token()) {
    $('setup').hidden = false;
    $('setup').innerHTML = '<b>Connect first.</b> Open <a href="/admin.html">Admin</a>, tap <b>Connect</b> and add your GitHub token. Then come back here.';
  }

  async function start(inputs){
    const t0 = Date.now() - 15000;
    const r = await fetch(API + '/actions/workflows/' + FLOW + '/dispatches', { method:'POST', headers:headers(true),
      body: JSON.stringify({ ref:'main', inputs }) });
    if (r.status === 401) throw new Error('Your GitHub token isn’t working. Reconnect it in Admin.');
    if (r.status === 403 || r.status === 404) throw new Error('This token can’t start GitHub jobs. Reconnect in Admin with a token that has the repo box ticked.');
    if (!r.ok) throw new Error('GitHub said ' + r.status + '.');
    for (let i = 0; i < 20; i++) {
      await sleep(3000);
      const lr = await fetch(API + '/actions/workflows/' + FLOW + '/runs?event=workflow_dispatch&per_page=5', { headers:headers(), cache:'no-store' });
      if (!lr.ok) continue;
      const run = ((await lr.json()).workflow_runs || []).find(x => new Date(x.created_at).getTime() >= t0);
      if (run) return run;
    }
    throw new Error('GitHub took the request but the job hasn’t appeared. Check again in a minute.');
  }
  async function follow(run){
    const until = Date.now() + 6 * 60000;
    while (Date.now() < until) {
      const r = await fetch(API + '/actions/runs/' + run.id, { headers:headers(), cache:'no-store' });
      if (r.ok) {
        run = await r.json();
        if (run.status === 'completed') return run;
        if (run.status === 'queued' && Date.now() - new Date(run.created_at).getTime() > 4 * 60000)
          throw new Error('GitHub hasn’t started the job. Check that Actions is switched on for the repo.');
        status(run.status === 'queued' ? 'Starting…' : 'Finding their email and sending…');
      }
      await sleep(4000);
    }
    throw new Error('Still going after 6 minutes. It may still send; check “Sent so far” later.');
  }
  // The job leaves its result as notes on itself: "sent" on success, "why" on failure.
  async function notes(run){
    try {
      const jr = await fetch(API + '/actions/runs/' + run.id + '/jobs', { headers:headers(), cache:'no-store' });
      const job = ((await jr.json()).jobs || [])[0]; if (!job) return [];
      const ar = await fetch(API + '/check-runs/' + job.id + '/annotations', { headers:headers(), cache:'no-store' });
      return ar.ok ? await ar.json() : [];
    } catch (e) { return []; }
  }

  async function find(){
    const site = $('site').value.trim();
    if (!site) { status('Paste their website first.', 'err'); $('site').focus(); return; }
    if (!token()) { status('Connect GitHub in Admin first.', 'err'); return; }
    $('go').disabled = true; $('setup').hidden = true;
    status('Starting…');
    try {
      const done = await follow(await start({ site, writer: 'lookup', note: '', again: '', dry_run: 'DRY' }));
      const ann = await notes(done);
      const found = ann.find(a => a.title === 'found'), why = ann.find(a => a.title === 'why');
      if (found) {
        const [email, venue] = found.message.split(' | ');
        status('');
        const st = $('st'); st.className = 'status ok';
        st.innerHTML = 'Found: <b id="foundEmail"></b>' + (venue ? ' <span id="foundVenue"></span>' : '') +
          '<br><button type="button" id="copyGo">Copy it and open the sender</button>';
        $('foundEmail').textContent = email;
        if (venue) $('foundVenue').textContent = '(' + venue + ')';
        $('copyGo').onclick = async () => {
          try { await navigator.clipboard.writeText(email); } catch (e) {}
          location.href = SENDER;
        };
      } else if (why) {
        status(esc(why.message), 'err');
      } else {
        status('Couldn’t tell what happened. <a href="' + esc(done.html_url) + '" target="_blank" rel="noopener">See the details ↗</a>', 'err');
      }
    } catch (e) { status(esc(e.message), 'err'); }
    $('go').disabled = false;
  }
  $('f').addEventListener('submit', e => { e.preventDefault(); find(); });

})();
</script>
</body>
</html>
