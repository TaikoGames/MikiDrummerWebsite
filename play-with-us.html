<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with us — Punk BC</title>
<meta name="description" content="We have a date going. Tell us who you are and hit the button.">
<link rel="canonical" href="https://www.mikidrummer.ca/play-with-us.html">
<link rel="icon" href="favicon.ico">
<style>
  :root{
    --bg:#0b0c0e; --card:#131518; --edge:#2b2f34; --dim:#7d848d; --mid:#a6adb6;
    --fg:#e9ebee; --hot:#e8672a; --ok:#5fbf7a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);line-height:1.6;
       font-family:"Helvetica Neue",system-ui,Arial,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:32px 18px 60px}
  .wrap{width:100%;max-width:520px}
  a{color:var(--hot)}

  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;
           color:var(--hot);font-weight:700}

  .date{border:1px solid var(--edge);border-radius:16px;background:var(--card);
        padding:26px 26px 24px;margin-top:14px}
  .day{font-family:"Arial Black",system-ui,sans-serif;
       font-size:clamp(34px,8vw,58px);line-height:1;letter-spacing:-.03em;
       text-wrap:balance}
  .sub{color:var(--mid);font-size:16px;margin-top:10px}
  .sub b{color:var(--fg)}
  .extra{color:var(--dim);font-size:14px;margin-top:8px}

  form{margin-top:20px;display:flex;flex-direction:column;gap:12px}
  label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        color:var(--dim);display:block;margin-bottom:5px}
  input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);
        border:1px solid var(--edge);border-radius:11px;padding:13px 14px;width:100%}
  input:focus{outline:2px solid var(--hot);outline-offset:1px;border-color:var(--hot)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  button{font:inherit;font-size:17px;font-weight:800;cursor:pointer;border:0;width:100%;
         border-radius:100px;padding:17px;background:var(--hot);color:#180a03;
         text-transform:uppercase;letter-spacing:.08em;margin-top:6px;
         box-shadow:0 14px 34px rgba(232,103,42,.32)}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}

  .said{font-size:15px;min-height:1.3em;text-align:center;margin-top:4px}
  .said.ok{color:var(--ok)} .said.err{color:#ff8f8f} .said.warn{color:#e7b53c}

  .done{display:none;text-align:center;padding:8px 0 4px}
  .done .tick{font-size:38px;line-height:1}
  .done h2{font-family:"Arial Black",system-ui,sans-serif;font-size:22px;margin:10px 0 6px}
  .done p{color:var(--mid);font-size:15px}
  body.sent .done{display:block}
  body.sent form,body.sent .extra{display:none}

  .none{border:1px dashed var(--edge);border-radius:16px;padding:26px;color:var(--mid);
        font-size:15.5px;line-height:1.7;margin-top:14px}
  footer{margin-top:26px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Punk BC</div>

  <div id="card" class="date" hidden>
    <div class="day" id="day">—</div>
    <div class="sub" id="where"></div>
    <div class="extra" id="extra"></div>

    <form id="form" novalidate>
      <div>
        <label for="band">Your band</label>
        <input id="band" type="text" autocomplete="organization" required>
      </div>
      <div>
        <label for="contact">Email or phone</label>
        <input id="contact" type="text" inputmode="email" autocomplete="email" required>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="company">Leave this empty</label>
        <input id="company" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" id="go">We're in</button>
      <p class="said" id="said" role="status" aria-live="polite"></p>
    </form>

    <div class="done">
      <div class="tick">✓</div>
      <h2 id="doneTitle">You're on the list</h2>
      <p>We'll be in touch with the details. Nothing's locked until we both say yes.</p>
    </div>
  </div>

  <div id="none" class="none" hidden>
    Nothing going right now. Message
    <a href="https://www.instagram.com/lifttheanchor/" target="_blank" rel="noopener">@lifttheanchor</a>
    and we'll tell you when the next one lands.
  </div>

  <footer>
    <a href="/punkbc.html">Punk BC shows</a> ·
    <a href="/lift-the-anchor-epk.html">Lift the Anchor</a><br>
    Booking us instead? <a href="/lift-the-anchor-epk.html#book">That form's here</a>.
  </footer>

</div>

<script>
(function () {
  'use strict';

  var SRC = '/data/open-dates.json';
  var FORM = 'https://formspree.io/f/xpqgrqvb';
  var $ = function (id) { return document.getElementById(id); };
  var date = null;

  function today() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function say(msg, kind) {
    var e = $('said'); e.textContent = msg; e.className = 'said' + (kind ? ' ' + kind : '');
  }

  fetch(SRC, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { dates: [] }; })
    .then(function (d) {
      // The soonest date still open. More than one and this shows the next —
      // one button is the whole point, so the rest wait their turn.
      date = (d.dates || [])
        .filter(function (x) { return x && x.date >= today() && (x.status || 'open') === 'open'; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
      if (!date) { $('none').hidden = false; return; }

      var dt = new Date(date.date + 'T12:00:00');
      $('day').textContent = isNaN(dt) ? date.date
        : dt.toLocaleDateString('en-CA', { weekday:'long', day:'numeric', month:'long' });
      $('where').innerHTML = date.venue
        ? '<b>' + esc(date.venue) + '</b>' + (date.city ? ' · ' + esc(date.city) : '')
        : (date.city ? esc(date.city) + ' · venue to be confirmed' : 'Venue to be confirmed');
      var extra = [date.slot, date.with ? 'with ' + date.with : '', date.note]
                    .filter(Boolean).join(' · ');
      if (extra) $('extra').textContent = extra; else $('extra').remove();
      $('card').hidden = false;
    })
    .catch(function () { $('none').hidden = false; });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var band = $('band').value.trim(), contact = $('contact').value.trim();
    if (!band)    { say('Who are you?', 'warn'); $('band').focus(); return; }
    // Deliberately loose: a phone number, an Instagram handle and an email are
    // all fine. Turning someone away over a format is worse than a reply we
    // have to chase.
    if (contact.length < 5) { say('An email or a phone number, so we can answer.', 'warn'); $('contact').focus(); return; }

    var when = $('day').textContent + (date.venue ? ' — ' + date.venue : '') +
               (date.city ? ', ' + date.city : '');
    var btn = $('go'), was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';
    say('');

    fetch(FORM, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: band + " is in for " + when,
        band: band,
        contact: contact,
        date: date.date,
        date_readable: when,
        _gotcha: $('company').value
      })
    }).then(function (r) {
      btn.disabled = false; btn.textContent = was;
      if (r.ok) {
        $('doneTitle').textContent = band + " — you're on the list";
        document.body.classList.add('sent');
        return;
      }
      say("That didn't send. DM @lifttheanchor and we'll sort it there.", 'err');
    }).catch(function () {
      btn.disabled = false; btn.textContent = was;
      say('No connection. Try again in a minute.', 'err');
    });
  });
})();
</script>
</body>
</html>
