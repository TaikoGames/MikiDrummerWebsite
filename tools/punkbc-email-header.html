<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0d0b0c}
  .band{width:620px;height:150px;box-sizing:border-box;position:relative;overflow:hidden;
        background:radial-gradient(420px 220px at 18% -30%, #4a0c0c 0%, transparent 70%), #0d0b0c;
        display:flex;align-items:center;gap:20px;padding:0 34px}
  .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:#e8372a}
  .icon{font-family:"Noto Color Emoji";font-size:62px;line-height:1;transform:rotate(-8deg)}
  h1{margin:0;font-family:"DejaVu Sans","Liberation Sans",sans-serif;font-weight:700;font-size:58px;
     letter-spacing:-2px;text-transform:uppercase;color:#f4efe6;line-height:1}
  p{margin:9px 0 0;font-family:"DejaVu Sans","Liberation Sans",sans-serif;font-weight:700;font-size:11px;
    letter-spacing:2.6px;white-space:nowrap;text-transform:uppercase;color:#e8372a}
</style></head><body>
<div class="band"><div class="icon">🤘</div><div><h1>Punk BC</h1><p>British Columbia Punk &amp; Hardcore Shows</p></div></div>
</body></html>
