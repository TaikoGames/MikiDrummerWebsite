<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punk BC — shows on screen</title>
<meta name="description" content="Every upcoming punk, hardcore and metal show in BC, one at a time, full screen. Made to leave running on a screen at a venue or a merch table.">
<link rel="canonical" href="https://www.mikidrummer.ca/slideshow.html">
<link rel="icon" href="favicon.ico">
<style>
  :root {
    --bg:#0b0c0e; --card:#131518; --edge:#2b2f34; --dim:#7d848d;
    --mid:#a6adb6; --fg:#e9ebee; --hot:#e8672a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Helvetica Neue",system-ui,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Two stacked slides so one can fade in over the other. Rebuilding a single
     slide would flash the background between shows. */
  .slide{position:fixed;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
  .slide.on{opacity:1}
  /* The poster is portrait and the screen is not, so the same image is blown
     up and blurred behind it to fill the sides rather than leaving black bars
     or cropping somebody's head off. */
  .bg{position:absolute;inset:-8%;background-size:cover;background-position:center;
      filter:blur(46px) saturate(1.25) brightness(.42);transform:scale(1.08)}
  .shade{position:absolute;inset:0;
         background:radial-gradient(120% 90% at 50% 40%, transparent 30%, rgba(0,0,0,.72) 100%)}

  .inner{position:relative;height:100%;display:grid;
         grid-template-columns:minmax(0,44%) minmax(0,1fr);
         gap:clamp(20px,4vw,62px);align-items:center;
         padding:clamp(20px,4vw,64px) clamp(22px,5vw,78px)}
  .art{justify-self:end;max-height:82vh;max-width:100%;border-radius:14px;
       box-shadow:0 30px 90px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);
       object-fit:contain;background:var(--card)}
  .no-art .inner{grid-template-columns:1fr;text-align:center;justify-items:center}
  .no-art .art{display:none}

  .when{font-family:ui-monospace,Menlo,monospace;color:var(--hot);font-weight:700;
        letter-spacing:.22em;text-transform:uppercase;font-size:clamp(13px,1.6vw,22px)}
  .band{font-family:"Arial Black",system-ui,sans-serif;line-height:1.02;letter-spacing:-.02em;
        margin:.28em 0 .3em;font-size:clamp(30px,5.4vw,86px);text-wrap:balance}
  .where{color:var(--fg);font-size:clamp(16px,2.1vw,32px);font-weight:600}
  .where b{color:var(--hot);font-weight:800}
  .note{color:var(--mid);font-size:clamp(13px,1.4vw,20px);margin-top:.5em;max-width:32ch;
        line-height:1.5}
  .no-art .note{max-width:60ch}
  .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:clamp(12px,1.8vw,22px)}
  .no-art .tags{justify-content:center}
  .tag{border:1px solid var(--edge);border-radius:100px;padding:6px 15px;
       font-size:clamp(11px,1.1vw,15px);color:var(--mid);text-transform:uppercase;letter-spacing:.08em}
  .tag.price{color:var(--hot);border-color:rgba(232,103,42,.5);font-weight:800}

  /* Chrome: a thin progress bar, a counter, and the site name so anyone
     photographing the screen knows where to find the rest. */
  .bar{position:fixed;left:0;top:0;height:3px;background:var(--hot);width:0;z-index:5}
  .bar.paused{background:var(--dim)}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
        justify-content:space-between;align-items:center;gap:14px;
        padding:clamp(10px,1.6vw,20px) clamp(16px,3vw,34px);
        font-size:clamp(11px,1.15vw,15px);color:var(--dim);
        background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .foot b{color:var(--fg)}
  .brand{letter-spacing:.16em;text-transform:uppercase}

  .help{position:fixed;top:0;right:0;z-index:6;padding:clamp(10px,1.6vw,18px) clamp(14px,2.4vw,26px);
        font-size:clamp(11px,1.1vw,14px);color:var(--dim);transition:opacity .4s ease}
  .help kbd{border:1px solid var(--edge);border-radius:5px;padding:1px 6px;color:var(--mid);
            font-family:inherit;font-size:.92em}
  body.idle .help{opacity:0}
  body.idle{cursor:none}

  .paused-flag{position:fixed;inset:auto auto 50% 50%;transform:translate(-50%,50%);z-index:6;
               font-size:clamp(13px,1.5vw,18px);letter-spacing:.2em;text-transform:uppercase;
               color:var(--fg);background:rgba(0,0,0,.62);border:1px solid var(--edge);
               border-radius:100px;padding:10px 22px;display:none}
  body.paused .paused-flag{display:block}

  .msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;
       color:var(--mid);font-size:16px;line-height:1.6}
  .msg a{color:var(--hot)}

  @media (max-width:820px){
    .inner{grid-template-columns:1fr;justify-items:center;text-align:center;
           align-content:center;gap:18px}
    .art{max-height:44vh;justify-self:center}
    .note{max-width:38ch}
    .tags{justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){ .slide{transition:none} }
</style>
</head>
<body>

<div class="bar" id="bar"></div>
<div class="slide" id="s0"></div>
<div class="slide" id="s1"></div>
<div class="paused-flag">Paused</div>

<div class="help" id="help">
  <kbd>space</kbd> pause · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>f</kbd> full screen
</div>

<div class="foot" id="foot" hidden>
  <span class="brand">Punk BC</span>
  <span id="count"></span>
  <span class="brand">mikidrummer.ca/punkbc</span>
</div>

<div class="msg" id="msg">Loading the board…</div>

<script>
(function () {
  'use strict';

  var SRC = '/punkbc-shows.json';
  var q = new URLSearchParams(location.search);
  var SECS = Math.max(2, Math.min(120, parseInt(q.get('secs'), 10) || 8));
  var DAYS = parseInt(q.get('days'), 10) || 0;
  var CITY = (q.get('city') || '').trim().toLowerCase();
  var VENUE = (q.get('venue') || '').trim().toLowerCase();

  var slides = [document.getElementById('s0'), document.getElementById('s1')];
  var bar = document.getElementById('bar');
  var msg = document.getElementById('msg');
  var foot = document.getElementById('foot');
  var count = document.getElementById('count');

  var shows = [], at = 0, live = 0, paused = false, t0 = 0, elapsed = 0, raf = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function today() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  // "Victoria, BC" and "Victoria" are one place; the board is hand-written.
  function head(s) { return String(s || '').toLowerCase().split(',')[0].trim(); }

  function pretty(iso) {
    var d = new Date(iso + 'T12:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-CA',
      { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // The placeholder is a grey SVG. Blown up to fill a screen it looks like a
  // broken page, so a show without real art gets a typographic slide instead.
  function realArt(s) {
    var u = String(s.image || '').trim();
    if (!u || u.indexOf('punkbc-placeholder') >= 0) return '';
    return /^https?:\/\//.test(u) ? u : '';
  }

  function build(el, s, img) {
    var bits = [];
    if (s.genre) bits.push('<span class="tag">' + esc(s.genre) + '</span>');
    if (s.price) bits.push('<span class="tag price">' + esc(s.price) + '</span>');
    if (s.time)  bits.push('<span class="tag">' + esc(s.time) + '</span>');

    var where = [];
    if (s.venue) where.push('<b>' + esc(s.venue) + '</b>');
    if (s.city)  where.push(esc(s.city));

    el.className = 'slide' + (img ? '' : ' no-art');
    el.innerHTML =
      (img ? '<div class="bg" style="background-image:url(&quot;' + esc(img) + '&quot;)"></div>' : '') +
      '<div class="shade"></div>' +
      '<div class="inner">' +
        (img ? '<img class="art" alt="" src="' + esc(img) + '">' : '') +
        '<div class="text">' +
          '<div class="when">' + esc(pretty(s.date)) + '</div>' +
          '<h1 class="band">' + esc(s.band) + '</h1>' +
          '<div class="where">' + where.join(' &middot; ') + '</div>' +
          (s.notes ? '<div class="note">' + esc(s.notes) + '</div>' : '') +
          (bits.length ? '<div class="tags">' + bits.join('') + '</div>' : '') +
        '</div>' +
      '</div>';
  }

  // Load the picture before the slide is shown. Swapping to a slide whose
  // image is still downloading shows an empty frame that then pops.
  function ready(url, done) {
    if (!url) return done('');
    var im = new Image();
    var settled = false;
    var finish = function (ok) {
      if (settled) return;
      settled = true;
      done(ok ? url : '');
    };
    im.onload = function () { finish(im.naturalWidth > 1); };
    im.onerror = function () { finish(false); };
    setTimeout(function () { finish(im.complete && im.naturalWidth > 1); }, 6000);
    im.src = url;
  }

  function show(i) {
    at = (i + shows.length) % shows.length;
    var s = shows[at];
    var next = 1 - live;
    ready(realArt(s), function (img) {
      build(slides[next], s, img);
      slides[next].classList.add('on');
      slides[live].classList.remove('on');
      live = next;
      count.textContent = (at + 1) + ' / ' + shows.length;
      restart();
    });
  }

  function restart() { elapsed = 0; t0 = performance.now(); }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (paused) { t0 = now - elapsed; return; }
    elapsed = now - t0;
    var pct = Math.min(1, elapsed / (SECS * 1000));
    bar.style.width = (pct * 100) + '%';
    if (pct >= 1) show(at + 1);
  }

  function go(n) { show(at + n); }
  function setPaused(p) {
    paused = p;
    document.body.classList.toggle('paused', p);
    bar.classList.toggle('paused', p);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); setPaused(!paused); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });
  // A tap on the right half moves on, the left half goes back — the same
  // gesture people already use on a phone.
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    go(e.clientX > window.innerWidth / 2 ? 1 : -1);
  });

  var idleTimer = null;
  function stirred() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3500);
  }
  ['mousemove', 'keydown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, stirred, { passive: true });
  });
  stirred();

  // A screen left running for a week should still be showing the right week.
  // Without this, a slideshow started on Friday still lists Friday's show as
  // upcoming the following Wednesday.
  setInterval(function () {
    var before = shows.length;
    shows = shows.filter(function (s) { return s.date >= today(); });
    if (shows.length !== before && shows.length) show(Math.min(at, shows.length - 1));
  }, 60 * 60 * 1000);

  fetch(SRC, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      var t = today();
      shows = (d.shows || d || []).filter(function (s) {
        if (!s || !s.date || !s.band || s.date < t) return false;
        if (CITY && head(s.city) !== CITY) return false;
        if (VENUE && String(s.venue || '').toLowerCase().indexOf(VENUE) < 0) return false;
        if (DAYS) {
          var end = new Date(); end.setDate(end.getDate() + DAYS);
          if (s.date > end.toISOString().slice(0, 10)) return false;
        }
        return true;
      }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      if (!shows.length) {
        msg.innerHTML = 'Nothing matches that. <a href="/slideshow.html">Show everything</a> ' +
                        'or <a href="/punkbc.html">open the board</a>.';
        return;
      }
      msg.remove();
      foot.hidden = false;
      show(0);
      raf = requestAnimationFrame(tick);
    })
    .catch(function () {
      msg.innerHTML = 'Could not load the shows. <a href="/punkbc.html">The board is here</a>.';
    });
})();
</script>
</body>
</html>
