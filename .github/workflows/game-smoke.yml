name: Game smoke test

# Loads the live drum game in a real browser and plays a few seconds of it,
# on a desktop window and on a phone.
#
# Exists because "it stays on Loading" was reported for a page that works
# perfectly on localhost. The difference between the repo and the deployed
# site is the thing nobody can see from a laptop, and it is exactly where a
# missing file, a stale deploy or a bad MIME type hides.
#
# The phone pass exists because the second report was "it's not even loading
# now, make it playable on the phone", and both halves of that turned out to
# be the same bug: an import map that Safari only understood from 16.4, which
# does not fail loudly -- it just declines to run the module. A desktop-only
# test is blind to the browsers the audience actually holds.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to test"
        default: "https://www.mikidrummer.ca/drum-game/"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --silent playwright@1.49.0 && npx playwright install --with-deps chromium

      - name: Load it and play it
        env:
          URL: ${{ github.event.inputs.url || 'https://www.mikidrummer.ca/drum-game/' }}
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const URL_ = process.env.URL;
          const b = await chromium.launch({ args:[
            '--autoplay-policy=no-user-gesture-required',
            '--use-gl=swiftshader','--enable-unsafe-swiftshader'] });

          // Are the modules and the three.js bundle actually being served?
          {
            const p = await b.newPage();
            for (const path of ['/js/drum-game.js','/js/drum-scene.js','/vendor/three/three.module.js']) {
              const r = await p.request.get(new URL(path, URL_).href);
              console.log(`  ${r.status()}  ${path}  ${r.headers()['content-type'] || ''}`);
              if (r.status() !== 200) throw new Error(path + ' is not being served');
            }
            // An import map is how this broke the first time. It must not come back.
            const html = await (await p.request.get(URL_)).text();
            if (/type=["']importmap["']/.test(html)) {
              throw new Error('an import map is back on the page -- Safari before 16.4 will not run the game');
            }
            await p.close();
          }

          async function pass(name, opts) {
            console.log('\n=== ' + name + ' ===');
            const ctx = await b.newContext(opts);
            const p = await ctx.newPage();
            const errs = [], bad = [];
            p.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
            p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text().slice(0,160)); });
            p.on('response', r => { if (r.status() >= 400) bad.push(r.status() + ' ' + r.url()); });

            await p.goto(URL_, { waitUntil: 'domcontentloaded' });
            await p.waitForFunction(() => document.querySelectorAll('#songs .song').length > 0,
                                    null, { timeout: 30000 })
                   .catch(async () => {
                     throw new Error('the song list never appeared: ' +
                       await p.$eval('#songsNote', e => e.textContent).catch(() => '(no note)'));
                   });
            console.log('songs listed:', await p.$$eval('#songs .song', e => e.length));

            await p.$$eval('#songs .song', els => els[0].click());
            const t0 = Date.now(); let last = '';
            while (Date.now() - t0 < 90000) {
              const h = await p.$eval('#panel h2', e => e.textContent).catch(() => '');
              const s = await p.$eval('#panel p', e => e.textContent).catch(() => '');
              const line = `[${h}] ${s}`;
              if (line !== last) { console.log('  ' + line); last = line; }
              if (h === 'Ready') break;
              if (/Could not|will not/.test(h)) throw new Error('load failed: ' + line);
              await p.waitForTimeout(250);
            }
            if (await p.$eval('#panel h2', e => e.textContent).catch(() => '') !== 'Ready') {
              throw new Error('never reached Ready -- stuck on: ' + last);
            }

            await p.click('#panel .btn');
            await p.waitForTimeout(6000);
            const clock = await p.$eval('#progress', e => e.textContent);
            const media = await p.$eval('#track', a => ({ t: +a.currentTime.toFixed(2), paused: a.paused }));
            console.log('  after 6s of play: clock', clock, ' audio', JSON.stringify(media));
            if (clock === '0:00') throw new Error('the song never started');
            if (media.paused || media.t < 3) throw new Error('the audio element is not playing');

            // The pads are the only control on a phone, so tapping them has to score.
            for (let i = 0; i < 36; i++) {
              const caps = await p.$$('.keycap');
              await caps[i % 3].dispatchEvent('pointerdown');
              await p.waitForTimeout(80);
            }
            const score = await p.$eval('#score', e => e.textContent);
            console.log('  score after 36 taps on the pads:', score);
            if (score === '0') throw new Error('tapping the pads scored nothing');

            // All three lanes have to be on screen, or a lane is unhittable.
            const box = await p.$eval('#c', c => { const r = c.getBoundingClientRect();
              return { w: Math.round(r.width), h: Math.round(r.height) }; });
            console.log('  canvas:', JSON.stringify(box));

            // Moving between songs without leaving the stage.
            const playingNow = () => p.$eval('#track', a => !a.paused);
            const titleNow = () => p.$eval('#nowPlaying', e => e.textContent);
            const first = await titleNow();
            await p.click('#next');
            await p.waitForFunction(t => document.querySelector('#nowPlaying').textContent !== t,
                                    first, { timeout: 30000 })
                   .catch(() => { throw new Error('Next did not change the song'); });
            await p.waitForTimeout(2500);
            console.log('  next song:', await titleNow(), '| still playing:', await playingNow());
            if (!await playingNow()) throw new Error('skipping to the next song stopped the audio');
            await p.click('#prev');
            await p.waitForTimeout(2000);
            if (await titleNow() !== first) throw new Error('Prev did not come back');

            await p.click('#pick');
            const listed = await p.$$eval('#pickList .pick', e => e.length);
            const marked = await p.$$eval('#pickList .pick.on', e => e.length);
            console.log('  in-game picker:', listed, 'songs,', marked, 'marked current');
            if (listed < 2) throw new Error('the in-game picker is empty');
            if (marked !== 1) throw new Error('the picker does not mark the current song');
            await p.$$eval('#pickList .pick', els => els[els.length - 1].click());
            await p.waitForTimeout(2500);
            if (!await playingNow()) throw new Error('picking a song from the stage stopped the audio');
            console.log('  picked from stage:', await titleNow());

            // The background pulses on the beats the chart carries, so a
            // chart served without them means a dead background and, more to
            // the point, a detector that has quietly gone back to having no
            // idea what tempo the song is.
            const map = await (await p.request.get(
              new URL('/data/beatmaps/noother.json', URL_).href)).json();
            const dens = map.notes.length / map.duration;
            console.log(`  chart check: ${map.bpm} BPM, ${map.beats.length} beats, ` +
                        `${map.notes.length} notes, ${dens.toFixed(2)}/s`);
            if (!(map.bpm > 60 && map.bpm < 260)) throw new Error('chart has no plausible tempo');
            if (!(map.beats && map.beats.length > 50)) throw new Error('chart carries no beats');
            // Density is judged per BEAT, not per second -- per second makes
            // this a test of the tempo. The full chart is deliberately dense
            // (the game thins it by metrical weight); what would be wrong is
            // it drifting to a strobe or back to the sparse version nobody
            // could hear their own drumming in.
            const perBeat = map.notes.length / map.beats.length;
            console.log(`  density: ${dens.toFixed(2)}/s, ${perBeat.toFixed(2)}/beat`);
            if (perBeat > 7) {
              throw new Error(`chart is saturating (${perBeat.toFixed(2)} notes/beat)`);
            }
            if (perBeat < 1.5) {
              throw new Error(`chart is too sparse (${perBeat.toFixed(2)} notes/beat) -- ` +
                              'the hi-hat lane went missing this way once already');
            }
            // Every note carries its metrical position, which is what the
            // difficulty setting filters on. Without it the setting silently
            // does nothing and everyone gets the full part.
            if (map.notes.some(n => n.w == null)) {
              throw new Error('chart notes have lost their metrical weight');
            }
            const ws = new Set(map.notes.map(n => n.w));
            if (ws.size < 3) {
              throw new Error('chart uses only ' + ws.size + ' metrical positions -- ' +
                              'the difficulty setting has nothing to sort by');
            }

            // The song list is built off a small index, not off every chart.
            const idx = await (await p.request.get(
              new URL('/data/beatmaps/index.json', URL_).href)).json();
            if (!idx.charts || idx.charts.length < 5) {
              throw new Error('the chart index is missing or short');
            }
            console.log(`  index: ${idx.charts.length} charts`);
            // Per-lane, because the failure that mattered was invisible in the
            // total: kicks and snares landed correctly while the hat lane sat
            // at a fifth of what a drummer plays, and the sum looked fine.
            const lanes = {};
            for (const n of map.notes) lanes[n.lane] = (lanes[n.lane] || 0) + 1;
            console.log('  lanes:', JSON.stringify(lanes));
            for (const L of ['kick', 'snare', 'hat']) {
              const perBeat = (lanes[L] || 0) / map.beats.length;
              if (perBeat < 0.25) {
                throw new Error(`the ${L} lane is nearly empty (${perBeat.toFixed(2)}/beat)`);
              }
            }

            // The old URL must keep redirecting, or every link to the game dies.
            const old = await p.request.get(new URL('/game.html', URL_).href);
            const oldHtml = await old.text();
            if (!/canonical[^>]+drum-game/.test(oldHtml) || !/refresh/.test(oldHtml)) {
              throw new Error('/game.html no longer redirects to the game');
            }

            console.log('  page errors:', errs.length ? errs : 'none');
            console.log('  bad responses:', bad.length ? bad : 'none');
            await ctx.close();
          }

          await pass('desktop', { viewport: { width: 1280, height: 800 } });
          await pass('iPhone 12 portrait', devices['iPhone 12']);
          await pass('iPhone 12 landscape', devices['iPhone 12 landscape']);
          await b.close();
          JS
          node smoke.mjs
