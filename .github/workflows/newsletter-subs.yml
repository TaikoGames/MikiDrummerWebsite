name: Newsletter subscribers

# Refreshes the encrypted subscriber list the admin page shows
# (data/newsletter-subs.enc.json). Started from the admin page's
# "Show subscribers" button; nothing fires on a schedule.
#
# The repository is public, so this job must never print or commit an email
# address in the clear: tools/newsletter_subs.py encrypts the list to the keys
# of the devices set up in the admin page and logs counts only.
#
# Uses the MAILERLITE_API_KEY secret the newsletter send already relies on.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter-subs
  cancel-in-progress: false

jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography
        run: python -m pip install --quiet cryptography

      - name: Self-test
        run: python3 tools/newsletter_subs.py --self-test

      - name: Fetch and encrypt the list
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: python3 tools/newsletter_subs.py

      - name: Commit
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletter-subs.enc.json
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Newsletter: refresh the encrypted subscriber list"
          for i in 1 2 3; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            # Another job pushed first: redo it on top of what landed.
            sleep $((i * 10))
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 tools/newsletter_subs.py
            git add data/newsletter-subs.enc.json
            git commit -m "Newsletter: refresh the encrypted subscriber list"
          done
          echo "Could not push after 3 tries"; exit 1
