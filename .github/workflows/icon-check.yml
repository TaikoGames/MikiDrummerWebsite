name: What the live site serves

# The favicon looked unchanged even in a private window, which rules out one
# browser's cache and points at the site. Nothing here can see www.mikidrummer.ca
# directly, so a runner fetches it and prints what the world actually gets:
# the bytes, their checksum against the repo, and the headers that say who
# served them and how old it is.

on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the icons and compare them with the repo
        run: |
          set +e
          SITE=https://www.mikidrummer.ca
          echo "## What www.mikidrummer.ca is serving" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | status | bytes | md5 served | md5 in repo | same |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # icon-48 and icon-96 matter most: Google will only take a favicon
          # whose sides are a multiple of 48, so those two are what it fetches.
          for f in site-icon.ico favicon.ico images/icon-48.png images/icon-96.png \
                   images/tab-icon-32.png images/tab-icon-16.png \
                   images/tab-icon-180.png; do
            code=$(curl -sS -o /tmp/got -w '%{http_code}' "$SITE/$f")
            got=$(md5sum /tmp/got | cut -d' ' -f1)
            size=$(wc -c < /tmp/got)
            repo=$(md5sum "$f" 2>/dev/null | cut -d' ' -f1)
            same=$([ "$got" = "$repo" ] && echo "yes" || echo "**NO**")
            echo "| $f | $code | $size | ${got:0:10} | ${repo:0:10} | $same |" >> "$GITHUB_STEP_SUMMARY"
            echo "$f -> $code $size $got (repo $repo)"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Who served it" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -sSI "$SITE/site-icon.ico" | grep -iE 'http/|server|age|cache-control|etag|last-modified|via|cf-|x-' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### The icon tags in the live homepage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -sS "$SITE/" | grep -iE 'rel="(shortcut )?icon"|apple-touch-icon' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Sizes inside the served favicon.ico" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -o /tmp/live.ico "$SITE/site-icon.ico"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import struct
          # Read the container directly. Pillow's ICO reader hands back frame
          # zero whatever size you ask it for, which made a correct file look
          # broken once already.
          raw = open('/tmp/live.ico','rb').read()
          _, _, n = struct.unpack('<HHH', raw[:6])
          print("frames served:", n)
          for i in range(n):
              w,h,_c,_r,_p,_b,size,off = struct.unpack('<BBBBHHII', raw[6+16*i:6+16*(i+1)])
              print("  %sx%s  %s bytes" % (w or 256, h or 256, size))
          PY

          # Google keeps one favicon per hostname. If the bare domain answers on
          # its own instead of redirecting to www, it is a second site as far as
          # Google is concerned, with its own icon to win over separately.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Does the bare domain redirect to www" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          curl -sSI https://mikidrummer.ca/ | grep -iE 'http/|location' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
