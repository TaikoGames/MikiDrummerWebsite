name: Punk BC show art

# Fills in real artwork for shows still carrying the placeholder.
#
# This has to run here rather than anywhere else: the machine the tool was
# written on cannot reach a single image host — bcbits, last.fm, Wikimedia,
# ytimg and gigpit are all refused at its egress proxy — so nothing could be
# verified from there. A runner has open network, which is the whole point.
#
# Art is taken from the ticket page already on each show, so it is the poster
# the promoter published for that night rather than a band photo matched by
# name. Every candidate is downloaded and opened before it is accepted, and
# what is accepted is committed here and served from this site, so it cannot
# rot when someone reorganises their CDN.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Report what it would do and change nothing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: punkbc-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet --upgrade pip Pillow

      - name: Self-test
        run: python3 tools/fetch_show_art.py --self-test

      - name: Fetch and verify the art
        run: |
          if [ "${{ inputs.check_only }}" = "true" ]; then
            python3 tools/fetch_show_art.py --check
          else
            python3 tools/fetch_show_art.py
          fi

      - name: Re-bake the board
        if: inputs.check_only != 'true'
        run: python3 tools/build_punkbc.py

      - name: Commit
        if: inputs.check_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No art changed."
            exit 0
          fi
          git add -A
          git commit -m "Punk BC: real artwork for shows that had the placeholder"
          # Other jobs (the board refresh, the site tree) push to the same
          # branch, often within the same minute. Rebase onto whatever landed
          # and try again rather than throwing the found art away.
          for i in 1 2 3 4; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
            git pull --rebase --no-edit origin "$GITHUB_REF_NAME" || {
              # Only the generated board can clash; rebuild it on top.
              git checkout --theirs punkbc.html shows/ sitemap.xml 2>/dev/null || true
              python3 tools/build_punkbc.py
              git add -A && GIT_EDITOR=true git rebase --continue
            }
          done
          echo "Could not push after 4 tries"; exit 1
