<!-- This page was an older, rougher copy of /services.html: 56 words, every
     service linking nowhere, and a <title> of "Mirkidrummer" -- the brand name
     misspelled, sitting in Google's index. Nothing on the site linked to it,
     so it was an orphan competing with the real page for the same terms.

     GitHub Pages serves static files and cannot issue a 301, so this is the
     strongest redirect available: a canonical pointing at the real page, an
     instant meta refresh, and a JS replace() so the dead URL does not end up
     in the visitor's back button. Deleting the file would have 404'd instead,
     which throws away whatever ranking the URL had rather than passing it on.

     Do not add noindex here. It contradicts the canonical -- one says "index
     the other page instead", the other says "index nothing" -- and Google
     resolves the conflict by dropping the URL rather than consolidating it. -->

<title>Services – Miki Drummer</title>
<link rel="canonical" href="https://www.mikidrummer.ca/services.html">
<meta http-equiv="refresh" content="0; url=/services.html">
<meta name="description" content="Miki Drummer's services have moved to /services.html — remote drum recording, custom drum tracks, online and in-person drum lessons, live setup and tuning, and drum rental in Vancouver.">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/images/icon-96.png">
<link rel="apple-touch-icon" href="/images/icon-180.png">

  body{background:#080605;color:#cfc9c5;font-family:'Space Mono','Courier New',monospace;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;
       padding:24px;text-align:center;line-height:1.7}
  a{color:#f0ede8;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#e8372a}
  a:hover{color:#e8372a}
</style>
</head>
<body>

     <a href="/services.html">Continue to Miki Drummer's services →</a></p>
  <script>location.replace('/services.html');</script>
</body>
