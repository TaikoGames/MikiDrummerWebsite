<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- The drum game moved from /game.html to its own section at /drum-game/,
     so it stands on its own rather than reading as one entry in a tools list.

     GitHub Pages serves static files and cannot issue a 301, so this is the
     strongest redirect available: a canonical pointing at the real page, an
     instant meta refresh, and a JS replace() so the dead URL does not end up
     in the visitor's back button. Deleting the file would have 404'd instead,
     which throws away whatever this URL has earned rather than passing it on.

     Do not add noindex here. It contradicts the canonical -- one says "index
     the other page instead", the other says "index nothing" -- and Google
     resolves the conflict by dropping the URL rather than consolidating it.
     Same reasoning as /service.html. -->

<title>Drum Along — moved to /drum-game/</title>
<link rel="canonical" href="https://www.mikidrummer.ca/drum-game/">
<meta http-equiv="refresh" content="0; url=/drum-game/">
<meta name="description" content="The free browser drum game has moved to mikidrummer.ca/drum-game/ — three lanes, twelve real punk and metal songs, charted from the recordings.">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  body{background:#0b0c0e;color:#e9ebee;font-family:'Helvetica Neue',system-ui,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;
       text-align:center;line-height:1.6}
  a{color:#e8672a}
</style>
<script>location.replace('/drum-game/' + location.search);</script>
</head>
<body>
  <p>The drum game has moved to <a href="/drum-game/">mikidrummer.ca/drum-game/</a>.</p>
</body>
</html>
