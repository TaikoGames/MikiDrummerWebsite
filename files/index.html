<!-- /files/ held a stale copy of an older version of this site: four pages,
     three of them titled "Mirkidrummer" -- the brand name misspelled -- with
     no canonical of any kind, indexable, and competing with the real pages
     for the same terms. Whatever links or ranking they had was being split
     off from the page that should have it.

     GitHub Pages serves static files and cannot issue a 301, so this is the
     strongest redirect available: a canonical at the real page, an instant
     meta refresh, and a JS replace() so the dead URL stays out of the back
     button. Deleting these would 404 instead, which throws the equity away
     rather than passing it on.

     Do not add noindex. It contradicts the canonical -- one says "index the
     other page instead", the other says "index nothing" -- and Google
     resolves the conflict by dropping the URL rather than consolidating it. -->

<title>Miki Drummer | Vancouver Drummer from Ibiza</title>
<link rel="canonical" href="https://www.mikidrummer.ca/">
<meta http-equiv="refresh" content="0; url=/">
<meta name="description" content="This page has moved to mikidrummer.ca/">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/images/icon-96.png">
<link rel="apple-touch-icon" href="/images/icon-180.png">

<style>
  body{background:#080605;color:#cfc9c5;font-family:'Space Mono','Courier New',monospace;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;
       padding:24px;text-align:center;line-height:1.7}
  a{color:#f0ede8;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#e8372a}
  a:hover{color:#e8372a}
</style>
</head>
<body>
  <p>This page has moved.<br>
     <a href="/">Continue to Miki Drummer &rarr;</a></p>
  <script>location.replace('/');</script>
</body>
</html>
